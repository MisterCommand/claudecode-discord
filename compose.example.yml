name: claude-code-discord

services:
  bot:
    image: ${DOCKER_IMAGE:-ghcr.io/mistercommand/claudecode-discord:latest}
    container_name: claude-discord
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOME: /home/node
      BASE_PROJECT_DIR: /projects
      BOT_CONFIG_DIR: /config
    volumes:
      - type: bind
        source: ${BASE_PROJECT_DIR:?Set BASE_PROJECT_DIR in .env}
        target: /projects
      - type: volume
        source: claude-home
        target: /home/node
      - type: volume
        source: bot-data
        target: /data
      - type: bind
        source: ${BOT_CONFIG_DIR:?Set BOT_CONFIG_DIR in .env}
        target: /config
        read_only: true
        # The mounted directory also carries the optional proxy.yaml for the
        # embedded Gemini Business pool. Account capture needs Chrome, which the
        # image does not include; run `npm run gemini -- login` on the host.

volumes:
  claude-home:
  bot-data:
